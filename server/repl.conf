# Production server configuration for Replit
name = "silvarium-social"
run = "python server/start_production.py"
language = "python"
wait_for_port = true

# Environment settings
env = "production"
python_version = "3.11"

# Port configuration
[http]
port = 5001
host = "0.0.0.0"
wait_for_port = true
timeout = 60

# Database configuration
[database]
provider = "postgresql"
url = "${DATABASE_URL}"

# Logging configuration
[logging]
level = "INFO"
format = "%(asctime)s [%(levelname)s] %(message)s"
file = "/tmp/silvarium.log"

# Workflow configuration
[workflow]
wait_for_port = true
port = 5001
timeout = 60

# Security settings
[security]
rate_limit = 100
rate_window = 900  # 15 minutes in seconds