# Production server configuration for Replit
name = "silvarium-social"
run = "python server/start_production.py"
language = "python"

# Environment settings
env = "production"
python_version = "3.11"

# Port configuration
[http]
port = 5000
host = "0.0.0.0"

# Custom domain support
[custom_domains]
enabled = true
ssl = true
force_https = true

# Database configuration
[database]
provider = "postgresql"
url = "${DATABASE_URL}"

# Logging configuration
[logging]
level = "INFO"
format = "%(asctime)s [%(levelname)s] %(message)s"
file = "/tmp/silvarium.log"

# Security settings
[security]
rate_limit = 100
rate_window = 900  # 15 minutes in seconds