[server]
name = "silvarium-social"
run = "python server/start_production.py"
language = "python"
wait_for_port = true
port = 5001
host = "0.0.0.0"
timeout = 120

[workflow]
name = "Production Server"
run = "python server/start_production.py"
language = "python"
wait_for_port = true
port = 5001
timeout = 120
environment = "production"

[environment]
python_version = "3.11"
env = "production"
SECRET_KEY = "${REPL_ID}"

[http]
port = 5001
host = "0.0.0.0"
wait_for_port = true
timeout = 120

[database]
provider = "postgresql"
url = "${DATABASE_URL}"

[logging]
level = "INFO"
format = "%(asctime)s [%(levelname)s] %(message)s"
file = "/tmp/silvarium.log"

[security]
rate_limit = 100
rate_window = 900

[production]
environment = "production"
workers = 4
max_requests = 1000