[server]
name = "silvarium-social"
run = "python server/start_production.py"
language = "python"
wait_for_port = true
port = 5001
host = "0.0.0.0"
timeout = 60

[logging]
level = "INFO"
format = "%(asctime)s [%(levelname)s] %(message)s"
file = "/tmp/logs/silvarium.log"

[database]
provider = "postgresql"
url = "${DATABASE_URL}"

[security]
rate_limit = 100
rate_window = 900
